# Paper plugin starter configuration. Balance data is saved in balances.yml.
default-balance: 0

# Discord / website Render connection.
# NEVER commit your secret to GitHub. Set URL and secret in the private
# plugins/DiddybludLifesteal/config.yml file on FalixNodes instead.
community-bridge:
  enabled: false
  url: "https://diddybludsmpwebsite.onrender.com"
  secret: ""
  # Only enable after verifying identity, eligibility, and payments independently.
  allow-staff-approved-ranks: false

# Earn 50 levels every 30 minutes actually online.
# /levels buy exchanges 1,000,000 in-game dollars for 1 level.
# Website shop costs spend levels (not real money). Change these as needed.
leveling:
  playtime-minutes-per-level: 30
  levels-per-playtime-interval: 50
  money-per-level: 1000000
  offers:
    starter:
      name: Starter Rank
      type: rank
      value: starter
      cost: 10
    champion:
      name: Champion Rank
      type: rank
      value: champion
      cost: 30
    legend:
      name: Legend Rank
      type: rank
      value: legend
      cost: 60
    bonusmoney:
      name: 500,000 in-game dollars
      type: money
      value: "500000"
      cost: 2
    bonusshards:
      name: 100 Shards
      type: shards
      value: "100"
      cost: 3

# Roles shown on the website application form (alongside all defined
# Minecraft ranks and custom /perms groups). Applications require staff review.
applications:
  roles:
    - Helper
    - Moderator
    - Builder
    - Developer
    - Administrator
    - Content Creator
    - Support
