name: DiddybludLifesteal
version: 0.7.0-paper
main: com.example.diddybludpaper.DiddybludPaper
api-version: '26.3'
description: Server-side Lifesteal SMP for Paper 26.3
commands:
  diddyblud: {description: Plugin information}
  leaderboard: {description: Place or remove a public top-10 hologram, permission: diddyblud.admin, usage: /leaderboard <money|playtime|hearts> [remove]}
  shop: {description: Open shop categories}
  sell: {description: Open sell deposit GUI, or OP price edit}
  bal: {description: Check money}
  balance: {description: Check money}
  money: {description: Grant money (OP)}
  pay: {description: Send money}
  shards: {description: Check or grant shards}
  hearts: {description: Check or change hearts (OP)}
  withdraw: {description: Withdraw a heart as an item}
  customitems: {description: Admin item GUI}
  ah: {description: Auction house}
  auction: {description: Auction house}
  orders: {description: Buy orders GUI}
  order: {description: Create orders}
  setspawn: {description: Set the server-wide spawn location (OP only), permission: diddyblud.admin}
  spawn: {description: Teleport to the server-wide spawn location}
  sethome: {description: Set home}
  delhome: {description: Delete home}
  home: {description: Visit a named home}
  sidebar: {description: Restore your money and shards HUD}
  scoreboard: {description: Restore your money and shards HUD}
  homes: {description: List your saved homes}
  tpa: {description: Teleport request}
  tpaccept: {description: Accept teleport request}
  tpdeny: {description: Deny teleport request}
  pv: {description: Open personal vault}
  vault: {description: Open personal vault}
  rtp: {description: Random teleport}
  rtpq: {description: Random teleport queue}
  spawner: {description: Spawner info}
permissions:
  diddyblud.admin:
    description: Edit shops, money, shards, hearts, and custom items
    default: op
